<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Swasthya Sathi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="auth-wrapper">
            <div class="auth-left">
                <div class="auth-branding">
                    <h1><i class="fas fa-heartbeat"></i> Swasthya Sathi</h1>
                    <p>Your AI-Powered Healthcare Companion</p>
                    <div class="auth-features">
                        <div class="auth-feature">
                            <i class="fas fa-shield-alt"></i>
                            <span>Secure & Private</span>
                        </div>
                        <div class="auth-feature">
                            <i class="fas fa-robot"></i>
                            <span>AI-Powered Analysis</span>
                        </div>
                        <div class="auth-feature">
                            <i class="fas fa-user-md"></i>
                            <span>Doctor Verified</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="auth-right">
                <button class="back-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </button>
                <div class="auth-container">
                    <div class="auth-tabs">
                        <button class="tab-btn active" data-tab="login">Login</button>
                        <button class="tab-btn" data-tab="register">Register</button>
                    </div>
                    
                    <!-- Login Form -->
                    <form id="login-form" class="auth-form active">
                        <h2>Welcome Back!</h2>
                        <p class="form-subtitle">Enter your credentials to access your account</p>
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="login-email" placeholder="your.email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <input type="password" id="login-password" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn-primary btn-block">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>

                    <!-- Register Form -->
                    <form id="register-form" class="auth-form">
                        <h2>Create Account</h2>
                        <p class="form-subtitle">Join Swasthya Sathi and start your health journey</p>
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Full Name</label>
                                <input type="text" id="register-name" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" id="register-email" placeholder="john@example.com" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-lock"></i> Password</label>
                                <input type="password" id="register-password" placeholder="Create password" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-calendar"></i> Age</label>
                                <input type="number" id="register-age" placeholder="25" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-venus-mars"></i> Gender</label>
                                <select id="register-gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-phone"></i> Phone</label>
                                <input type="tel" id="register-phone" placeholder="1234567890" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary btn-block">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </form>
                    
                    <div id="auth-message" class="message"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
